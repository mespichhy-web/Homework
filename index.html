<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Document Structure</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="browser-window">
    <div class="browser-bar" aria-hidden="true">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="filename">document-structure.html</span>
    </div>

    <div class="page-layout">
      <header class="site-header">&lt;header&gt;</header>
      <nav class="site-nav" aria-label="Main navigation">&lt;nav&gt;</nav>

      <div class="content-layout">
        <main class="main-content">
          <article class="article-content">&lt;article&gt;</article>
          <section class="section-content">&lt;section&gt;</section>
        </main>
        <aside class="sidebar">&lt;aside&gt;</aside>
      </div>

      <footer class="site-footer">&lt;footer&gt;</footer>
    </div>
  </div>
</body>
</html>
